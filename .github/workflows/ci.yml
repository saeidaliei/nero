name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build release binaries
        run: cargo build --workspace --release

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: gui
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: gui
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Check Tauri backend
        run: cargo check --manifest-path gui/src-tauri/Cargo.toml

      - name: Format Tauri backend
        run: cargo fmt --manifest-path gui/src-tauri/Cargo.toml -- --check

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Build CLI
        run: cargo build -p nero

      - name: Run smoke test
        env:
          NERO_BIN: ${{ github.workspace }}/target/debug/nero
        run: bash tests/smoke.sh
