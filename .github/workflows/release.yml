name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate tag and project versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"release tag must look like v1.2.3, got {tag!r}")
          expected = tag[1:]

          root = tomllib.loads(Path("Cargo.toml").read_text())
          package_version = root["workspace"]["package"]["version"]

          gui_cargo = tomllib.loads(Path("gui/src-tauri/Cargo.toml").read_text())
          gui_package = json.loads(Path("gui/package.json").read_text())
          tauri = json.loads(Path("gui/src-tauri/tauri.conf.json").read_text())

          versions = {
              "workspace": package_version,
              "gui Cargo": gui_cargo["package"]["version"],
              "gui package": gui_package["version"],
              "tauri": tauri["version"],
          }
          bad = {name: value for name, value in versions.items() if value != expected}
          if bad:
              raise SystemExit(f"release version mismatch: expected {expected}, got {bad}")
          print(f"release version: {expected}")
          PY

  tests:
    name: Test release source
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            desktop-file-utils \
            libfuse2 \
            rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install --no-audit --no-fund

      - name: Build CLI
        run: cargo build -p nero --release

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          mkdir -p release
          tar -C target/release -czf "release/nero-cli-${RELEASE_NAME}-${PLATFORM}.tar.gz" nero

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path target/release/nero.exe -DestinationPath "release/nero-cli-$env:RELEASE_NAME-$env:PLATFORM.zip"

      # On Linux, compile once and bundle each package format separately.
      # This prevents a linuxdeploy/AppImage failure from hiding a successful
      # DEB or RPM bundle.
      - name: Build GUI binary (Linux, without bundling)
        if: runner.os == 'Linux'
        working-directory: gui
        run: npm run tauri:build -- --no-bundle

      - name: Bundle Linux DEB and RPM
        if: runner.os == 'Linux'
        working-directory: gui
        run: npm run tauri -- bundle --bundles deb,rpm

      - name: Bundle Linux AppImage
        if: runner.os == 'Linux'
        id: linux_appimage
        continue-on-error: true
        working-directory: gui
        env:
          NO_STRIP: "true"
        run: npm run tauri -- bundle --bundles appimage --verbose

      - name: Build and bundle GUI (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: gui
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri:build

      - name: Collect Linux GUI installers
        if: runner.os == 'Linux'
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
          APPIMAGE_OUTCOME: ${{ steps.linux_appimage.outcome }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release

          debs=(gui/src-tauri/target/release/bundle/deb/*.deb)
          rpms=(gui/src-tauri/target/release/bundle/rpm/*.rpm)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::Tauri did not produce a DEB package"
            exit 1
          fi
          if (( ${#rpms[@]} == 0 )); then
            echo "::error::Tauri did not produce an RPM package"
            exit 1
          fi
          cp "${debs[0]}" "release/nero-gui-${RELEASE_NAME}-${PLATFORM}.deb"
          cp "${rpms[0]}" "release/nero-gui-${RELEASE_NAME}-${PLATFORM}.rpm"

          if [[ "$APPIMAGE_OUTCOME" == "success" ]]; then
            appimages=(gui/src-tauri/target/release/bundle/appimage/*.AppImage gui/src-tauri/target/release/bundle/appimage/*.appimage)
            if (( ${#appimages[@]} > 0 )); then
              cp "${appimages[0]}" "release/nero-gui-${RELEASE_NAME}-${PLATFORM}.AppImage"
            else
              echo "::warning::AppImage bundling succeeded but no AppImage file was found"
            fi
          else
            echo "::warning::AppImage bundling failed; DEB and RPM will still be published"
          fi

      - name: Collect macOS DMG installer
        if: runner.os == 'macOS'
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(gui/src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo "::error::Tauri did not produce a macOS DMG"
            exit 1
          fi
          cp "${dmgs[0]}" "release/nero-gui-${RELEASE_NAME}-${PLATFORM}.dmg"

      - name: Collect Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $count = 0
          $msiFiles = Get-ChildItem -Path "gui/src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          foreach ($file in $msiFiles) {
            Copy-Item $file.FullName "release/nero-gui-$env:RELEASE_NAME-$env:PLATFORM.msi"
            $count++
          }
          $setupFiles = Get-ChildItem -Path "gui/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          foreach ($file in $setupFiles) {
            Copy-Item $file.FullName "release/nero-gui-$env:RELEASE_NAME-$env:PLATFORM-setup.exe"
            $count++
          }
          if ($count -eq 0) { throw "Tauri did not produce an MSI or NSIS installer" }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  arch-package:
    name: Build Arch Linux CLI/TUI package (best-effort)
    needs: build
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux CLI archive
        uses: actions/download-artifact@v5
        with:
          name: release-linux-x86_64
          path: release-assets

      - name: Build pacman package in Arch Linux
        id: arch_build
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm \
            -e RELEASE_TAG="$RELEASE_TAG" \
            -v "$GITHUB_WORKSPACE:/work" \
            archlinux:base-devel \
            bash /work/packaging/arch/build-release-package.sh

      - name: Upload Arch package artifact
        if: steps.arch_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-archlinux-x86_64
          path: release-assets/nero-bin-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, arch-package]
    # Arch packaging is optional; never publish unless the main platform matrix passed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nero ${TAG#v}" \
            --generate-notes
