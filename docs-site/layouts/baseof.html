<!doctype html>
<html lang="en">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="site-shell">
      {{ partial "header.html" . }}
      <main id="content" class="page-shell">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
      {{ partial "search.html" . }}
    </div>
    <script>
      window.NERO_DOCS = [
        {{- range (where .Site.AllPages "Section" "docs") }}
        {{ dict "title" .Title "permalink" .RelPermalink "summary" (.Summary | plainify) | jsonify }},
        {{- end }}
      ];
    </script>
    <script src="{{ "js/docs.js" | relURL }}" defer></script>
  </body>
</html>
