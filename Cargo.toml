[workspace]
resolver = "2"
members = [
    "crates/nero-core",
    "crates/nero",
    "crates/nero-tui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Nero contributors"]
license = "MIT"
repository = "https://github.com/nero-project/nero"

[workspace.lints.rust]
unsafe_code = "forbid"
