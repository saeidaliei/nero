[workspace]
resolver = "2"
members = [
    "crates/nero-core",
    "crates/nero",
    "crates/nero-tui",
]
exclude = [
    # The Tauri desktop app is built independently, but reuses nero-core by path.
    "gui/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "1.0.0"
authors = ["Nero contributors"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
